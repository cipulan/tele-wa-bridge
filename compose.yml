services:
  telegram-wa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: telegram-wa

    restart: unless-stopped
    networks:
      - api-wa_waha-network

    env_file:
      - .env

    init: true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${HEALTH_PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    mem_limit: 128m
    cpus: 0.25

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  api-wa_waha-network:
    external: true
